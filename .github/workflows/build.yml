name: Build LMOFreeform

on:
  workflow_dispatch:
  push:
    branches:
      - sixteen-qpr0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LMOFreeform
        uses: actions/checkout@v4

      - name: Checkout ZygoteLoader 3.0
        uses: actions/checkout@v4
        with:
          repository: Kr328/ZygoteLoader
          ref: 3.0
          path: ZygoteLoader

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;23.1.7779620" \
            "cmake;3.22.1"

      - name: Build ZygoteLoader
        working-directory: ZygoteLoader
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Build LMOFreeform
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find outputs
        run: |
          find . -type f \( -name "*.apk" -o -name "*.zip" \) -print

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: LMOFreeform-build
          path: |
            **/build/outputs/**/*.apk
            **/build/outputs/**/*.zip
